// The shown value is highlighted while it is still replaceable, so the behaviour is visible.
function keyTap(d) {
  if (d === 'back') {
    keypadBuf = keypadFresh ? '' : keypadBuf.slice(0, -1);   // backspace on a fresh value clears it
    keypadFresh = false;
  } else {
    if (keypadFresh) { keypadBuf = ''; keypadFresh = false; }
    if ((keypadBuf + d).length <= 4) keypadBuf = (keypadBuf === '0' ? '' : keypadBuf) + d;
  }
  paintKeypadValue();
}
// "+5" means add to what is there, so a preset builds on the current value and ends overwrite mode.
function keyPreset(n) {
  keypadBuf = String(Math.min(MAX_QTY, (parseInt(keypadBuf) || 0) + n));
  keypadFresh = false;
  paintKeypadValue();
}
function paintKeypadValue() {
  const el = document.getElementById('kp-val');
  if (!el) return;
  el.textContent = keypadBuf || '0';
  el.classList.toggle('fresh', keypadFresh);
}
function keyConfirm() {
  const code = keypad.code;
  setQty(code, parseInt(keypadBuf) || 0);
  closeKeypad();
  // needs_qty via keypad = an explicit confirm → clear it immediately (no debounce wait).
  if (needsQty.has(code) && (qty[code] || 0) > 0) { clearTimeout(needsQtyTimers[code]); needsQty.delete(code); delete needsQtyTimers[code]; }
  refreshCard(code); updateBars();
  if (activeView === 'cart') renderCart(); else renderClarifyBox();
}
function keypadBackdrop(e) { if (e.target === e.currentTarget) closeKeypad(); }
function renderKeypad() {
  const el = document.getElementById('keypad');
  if (!keypad) { el.classList.add('hidden'); return; }
  const keys = ['1','2','3','4','5','6','7','8','9','','0','back'];
  const grid = keys.map(k => k === ''
    ? '<button class="kp-key blank"></button>'
    : (k === 'back'
        ? '<button class="kp-key back" onclick="keyTap(\'back\')">⌫</button>'
        : '<button class="kp-key" onclick="keyTap(\'' + k + '\')">' + k + '</button>')).join('');
  const presets = [5, 10, 12].map(n => '<button class="kp-preset" onclick="keyPreset(' + n + ')">+' + n + '</button>').join('');
  el.className = 'sheet-backdrop';
  el.innerHTML =
    '<div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-handle"></div>' +
      '<div class="keypad-name">' + esc(findSku(keypad.code).name) + '</div>' +
      '<div class="keypad-val' + (keypadFresh ? ' fresh' : '') + '" id="kp-val">' + (keypadBuf || '0') + '</div>' +
      '<div class="keypad-presets">' + presets + '</div>' +
      '<div class="keypad-grid">' + grid + '</div>' +
      '<button class="keypad-confirm" onclick="keyConfirm()">אישור</button>' +
    '</div>';
  el.setAttribute('onclick', 'keypadBackdrop(event)');
}

// ══════════════════ CART ══════════════════
function renderCart() {
  const list = document.getElementById('cart-items');
  const bottom = document.getElementById('cart-bottom');
  const sum = document.getElementById('cart-sum');
  const items = lines();
  const pending = [...needsQty].filter(c => !(qty[c] > 0));   // needs_qty lines still awaiting a quantity

  if (items.length === 0 && pending.length === 0) {
    const canCancel = isEditOrder() && !isEditExpired();
    const sub = canCancel ? 'הסרת את כל הפריטים — שליחה תבטל את ההזמנה' : 'חזרו לקטלוג כדי להוסיף מוצרים';
    list.innerHTML =
      '<div class="cart-empty"><div class="cart-empty-ico"><svg viewBox="0 0 24 24"><path d="M3 6h18l-2 11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L3 6z" stroke-linejoin="round"></path><path d="M8 6V4a4 4 0 0 1 8 0v2"></path></svg></div>' +
      '<div class="cart-empty-title">העגלה ריקה</div><div class="cart-empty-sub">' + sub + '</div>' +
      '<button class="cart-empty-btn" onclick="goCatalog()">עבור לקטלוג</button></div>';
    sum.textContent = '';
    setCartBottom(canCancel ? 'cancel' : 'disabled');
    return;
  }

  const u = items.reduce((a, [, q]) => a + q, 0);
  sum.textContent = pending.length
    ? ('יש לאשר כמות ל־' + pending.length + ' פריטים לפני שליחה')
    : (items.length + ' פריטים · ' + u + ' יחידות');

  // Confirmed lines (qty>0) + needs_qty lines still at 0 (rendered highlighted), grouped by market.
  const byMkt = {};
  items.map(([code, q]) => ({ code, q, needs: false }))
    .concat(pending.map(code => ({ code, q: 0, needs: true })))
    .forEach(({ code, q, needs }) => {
      const info = findSku(code);
      (byMkt[info.market_type_id] = byMkt[info.market_type_id] || []).push({ code, q, name: info.name, needs });
    });

  let html = Object.entries(byMkt).map(([mkt, rows]) =>
    '<div class="cart-group"><div class="cart-group-title">' + esc(marketName(mkt)) + ' · ' + rows.length + '</div>' +
    rows.map(r =>
      '<div class="crow' + (r.needs ? ' needs-qty' : '') + '"' + (r.needs ? ' style="border-inline-start:3px solid var(--amber);background:var(--amber-soft)"' : '') + '><div class="crow-info"><div class="crow-name">' + esc(r.name) +
        (r.needs ? ' <span style="color:var(--amber-ink);font-size:11.5px;font-weight:700">· אשר כמות</span>' : '') + '</div>' +
        '<div class="crow-sku">' + esc(displayCode(r.code)) + '</div></div>' +
        '<div class="crow-ctrls">' +
          '<button class="qbtn minus" onclick="dec(\'' + js(r.code) + '\')" aria-label="הפחת">−</button>' +
          '<button class="qnum" onclick="openKeypad(\'' + js(r.code) + '\')">' + r.q + '</button>' +
          '<button class="qbtn plus" onclick="inc(\'' + js(r.code) + '\')" aria-label="הוסף">+</button>' +
          '<button class="rm-btn" onclick="removeFromCart(\'' + js(r.code) + '\')" aria-label="הסר"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke-linejoin="round" stroke-linecap="round"></path></svg></button>' +
        '</div></div>').join('') +
    '</div>').join('');

  html += cartSuggestionsHtml();
  list.innerHTML = html;
  setCartBottom(isEditExpired() ? 'disabled' : (pending.length ? 'needsqty' : 'send'));
}

// "אולי תרצה להוסיף גם" — favourites (suggested qty > 0) not already in the cart. Edit flow only,
// matching the chat: on a brand-new order the hero already covers adoption.
function cartSuggestionsHtml() {
  if (catalog.existingOrder === null) return '';
  const inCart = new Set(lines().map(([c]) => c));
  const sugg = (catalog.favorites || []).filter(f => f.suggested_qty > 0 && !inCart.has(f.sku_code));
  if (!sugg.length) return '';
  return '<div class="suggest"><div class="suggest-head">אולי תרצה להוסיף גם</div>' +
    sugg.map(f =>
      '<div class="suggest-row"><div class="suggest-info"><div class="suggest-name">' + esc(f.name) + '</div>' +
      '<div class="suggest-meta">מוצע ' + f.suggested_qty + '</div></div>' +
      '<button class="suggest-add" onclick="addSuggested(\'' + js(f.sku_code) + '\',' + f.suggested_qty + ')">+ הוסף</button></div>').join('') +
    '</div>';
}

// mode: 'send' | 'cancel' (empty edit → cancel the order) | 'disabled'
function setCartBottom(mode) {
  const el = document.getElementById('cart-bottom');
  let btn, clear = '';
  if (mode === 'cancel') {
    btn = '<button class="send-btn danger" onclick="sendOrder()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke-linejoin="round" stroke-linecap="round"></path></svg>בטל הזמנה</button>';
  } else if (mode === 'disabled') {
    btn = '<button class="send-btn" disabled>' + (isEditExpired() ? 'חלון העריכה נסגר' : 'העגלה ריקה') + '</button>';
  } else if (mode === 'needsqty') {
    btn = '<button class="send-btn" disabled>אשרו כמות לפני שליחה</button>';
  } else {
    btn = '<button class="send-btn" onclick="sendOrder()"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linejoin="round" stroke-linecap="round"></path></svg>שלח הזמנה</button>';
    clear = '<button class="clear-btn" onclick="clearCart()">אפס את הסל</button>';
  }
  el.innerHTML = btn + clear;
}
async function clearCart() {
  if (!(await askConfirm({
    title: 'לאפס את הסל?',
    msg:   'כל הפריטים יוסרו מהסל.',
    yes:   'כן, אפס את הסל',
    no:    'ביטול',
  }))) return;
  qty = {}; needsQty.clear(); renderCart(); updateBars();
}

// ── edit deadline banner (edit links only) ──
function applyEditDeadlineState() {
  const banner = document.getElementById('cart-deadline');
  if (!banner) return;
  if (!editUntilEpoch) { banner.classList.add('hidden'); return; }
  const expired = isEditExpired();
  banner.classList.remove('hidden');
  banner.classList.toggle('expired', expired);
  banner.textContent = expired ? 'חלון העריכה נסגר — כבר לא ניתן לשנות את ההזמנה' : (catalog.editUntilLabel || '');
  if (expired && activeView === 'cart') renderCart();  // flips send→disabled
}

// ══════════════════ CLARIFICATIONS ══════════════════
function openClarify(kind, idx) {
  clarify = { kind, idx }; variantSel = {};
  clarifyEntry = { back: rawCloseClarify };
  openOverlay(clarifyEntry);   // push BEFORE render so an early rawCloseClarify (item vanished) unwinds it
  renderClarify();
}
function rawCloseClarify() { clarify = null; variantSel = {}; document.getElementById('clarify').classList.add('hidden'); }
function closeClarify() { const e = clarifyEntry; clarifyEntry = null; rawCloseClarify(); unwindOverlay(e); }
function clarifyBackdrop(e) { if (e.target === e.currentTarget) closeClarify(); }

function pickUnmatched(code) {
  const it = unmatchedItems[clarify.idx];
  // Add the quantity the customer actually asked for ("× 12 יחידות"), which the server sends
  // with the clarification. Only not_found_items arrive without one → fall back to 1.
  const q = Number(it && it.quantity) || 1;
  setQty(code, (qty[code] || 0) + q);
  if (it && it.text) resolvedAliases.push({ raw_text: it.text, sku_code: code, fat_pct: (it.fat_pct != null ? it.fat_pct : null) });
  unmatchedItems.splice(clarify.idx, 1);
  closeClarify();
  renderCatalog();
  toast(findSku(code).name + ' נוסף לסל');
}
function dropUnmatched() {
  const it = unmatchedItems[clarify.idx];
  if (it && it.text) droppedUnmatched.push(it.text);
  unmatchedItems.splice(clarify.idx, 1);
  closeClarify();
  renderCatalog();
  toast('הפריט הוסר מההזמנה');
}
function toggleVariant(code) { if (variantSel[code]) delete variantSel[code]; else variantSel[code] = true; renderClarify(); }
function confirmVariants() {
  const it = allVariantsItems[clarify.idx];
  const sel = Object.keys(variantSel);
  if (!sel.length) { toast('לא נבחרו סוגים'); return; }
  const q = Number(it.quantity) || 1;
  sel.forEach(code => { setQty(code, (qty[code] || 0) + q); });
  allVariantsItems.splice(clarify.idx, 1);
  closeClarify();
  renderCatalog();
  toast(sel.length + ' מוצרים נוספו לסל');
}

function renderClarify() {
  const el = document.getElementById('clarify');
  if (!clarify) { el.classList.add('hidden'); return; }
  let title = '', sub = '', body = '', drop = '';

  if (clarify.kind === 'unmatched') {
    const it = unmatchedItems[clarify.idx];
    if (!it) { closeClarify(); return; }
    title = 'מה התכוונת ב"' + esc(it.text) + '"?';
    sub = (it.suggestions && it.suggestions.length) ? 'בחר את המוצר המתאים מהקטלוג' : 'לא מצאנו התאמה בקטלוג';
    body = (it.suggestions || []).map(s =>
      '<button class="opt" onclick="pickUnmatched(\'' + js(s.sku_code) + '\')">' +
        '<div class="opt-mark">←</div>' +
        '<div class="opt-info"><div class="opt-name">' + esc(s.name) + '</div>' +
        '<div class="opt-meta">' + esc(s.barcode || s.sku_code) + ' · ' + esc(marketName(s.market_type_id)) + '</div></div></button>').join('')
      || '<div class="no-opts">לא נמצאו הצעות מתאימות</div>';
    drop = '<button class="drop-btn danger" onclick="dropUnmatched()"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke-linejoin="round" stroke-linecap="round"></path></svg>המוצר לא ברשימה — הסר מההזמנה</button>';
  } else {
    const it = allVariantsItems[clarify.idx];
    if (!it) { closeClarify(); return; }
    title = 'בחר סוגים ל"' + esc(it.keyword) + '"';
    sub = (Number(it.quantity) || 1) + ' יח\' לכל סוג שתבחר';
    body = (it.variants || []).map(v => {
      const sel = !!variantSel[v.sku_code];
      return '<button class="opt' + (sel ? ' sel' : '') + '" onclick="toggleVariant(\'' + js(v.sku_code) + '\')">' +
        '<div class="opt-check">' + (sel ? '✓' : '') + '</div>' +
        '<div class="opt-info"><div class="opt-name">' + esc(v.name) + '</div>' +
        '<div class="opt-meta">' + esc(v.barcode || v.sku_code) + ' · ' + esc(marketName(v.market_type_id)) + '</div></div></button>';
    }).join('') || '<div class="no-opts">לא נמצאו סוגים מתאימים</div>';
    if ((it.variants || []).length) body += '<button class="var-confirm" onclick="confirmVariants()">הוסף לסל</button>';
    drop = '<button class="drop-btn" onclick="closeClarify()">אף אחד מהם — סגור</button>';
  }

  el.className = 'sheet-backdrop';
  el.innerHTML =
    '<div class="sheet tall" onclick="event.stopPropagation()">' +
      '<div class="sheet-handle"></div>' +
      '<div class="clarify-title">' + title + '</div>' +
      '<div class="clarify-sub">' + sub + '</div>' + body + drop +
    '</div>';
  el.setAttribute('onclick', 'clarifyBackdrop(event)');
}

// ══════════════════ SUBMIT ══════════════════
async function sendOrder() {
  const entries = lines();
  const isCancel = entries.length === 0;
  // An empty cart is only actionable while editing an order → it cancels the order.
  if (isCancel && !isEditOrder()) return;
  if (isEditExpired()) { fatal('לא ניתן לערוך את ההזמנה יותר — חלון העריכה נסגר'); return; }
  // Cancelling wipes the whole order — confirm with a styled in-page dialog (never the native confirm).
  if (isCancel && !(await askConfirm({
    title: 'לבטל את ההזמנה?',
    msg:   'כל הפריטים יוסרו וההזמנה תבוטל.',
    yes:   'כן, בטל הזמנה',
    no:    'השאר את ההזמנה',
  }))) return;

  const items = entries.map(([sku_code, quantity]) => ({ sku_code, quantity })); // [] when cancelling

  showPosting(isCancel ? 'מבטל את ההזמנה...' : 'שולח את ההזמנה...');

  // Offline demo: nothing leaves the browser. Show the same posting overlay, then a success
  // screen instead of the wa.me hand-off.
  if (DEMO_ON) { setTimeout(() => demoSuccess(items), 900); return; }
  const token = new URLSearchParams(location.search).get('t');
  if (!pendingRequestId) {
    pendingRequestId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random();
  }

  let respStatus = 'ok';
  try {
    const r = await fetch(API + '/web-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ items, clientRequestId: pendingRequestId, aliases: resolvedAliases, droppedUnmatched }),
    });
    if (r.status === 401) { hidePosting(); fatal('הקישור פג תוקף — בקש קישור חדש'); return; }
    if (!r.ok) {
      let errCode = ''; try { errCode = (await r.json()).error; } catch (e) {}
      hidePosting();
      if (errCode === 'edit_window_closed') { fatal('לא ניתן לערוך את ההזמנה יותר — חלון העריכה נסגר'); return; }
      toast('שגיאה בשליחה, נסה שוב');
      return;
    }
    try { respStatus = (await r.json()).status || 'ok'; } catch (e) {}
  } catch (e) {
    console.error(e);
    hidePosting();
    toast('שגיאת רשת, נסה שוב');
    return;
  }

  // Success: the order is applied AND the bot has pushed the WhatsApp confirmation. Keep the overlay
  // up with a status line, then NAVIGATE to the bot chat so the customer lands on that confirmation.
  pendingRequestId = null;
  showPosting(
    (isCancel || respStatus === 'cancelled') ? 'ההזמנה בוטלה ✓ פותח וואטסאפ...'
    : respStatus === 'unchanged' ? 'לא בוצעו שינויים — פותח וואטסאפ...'
    : 'ההזמנה נשלחה ✓ פותח וואטסאפ...'
  );
  const phone = (catalog.distributorPhone || '').replace(/\D/g, '');
  window.location.href = 'https://wa.me/' + phone;
}

// Demo-only end screen — stands in for the WhatsApp hand-off the live page does.
function demoSuccess(items) {
  hidePosting();
  const units = items.reduce((a, it) => a + it.quantity, 0);
  const list = items.map(it => '<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)">' +
      '<span style="font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(findSku(it.sku_code).name) + '</span>' +
      '<span style="font-weight:800;flex:none">× ' + it.quantity + '</span></div>').join('');
  const app = document.getElementById('app');
  app.innerHTML =
    '<div class="success">' +
      '<div class="success-ico"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>' +
      '<div class="success-title">' + (items.length ? 'ההזמנה נשלחה' : 'ההזמנה בוטלה') + '</div>' +
      '<div class="success-sum">' + (items.length ? items.length + ' פריטים · ' + units + ' יחידות' : '') + '</div>' +
      (items.length ? '<div class="success-note" style="text-align:start;max-height:40vh;overflow:auto">' + list + '</div>' : '') +
      '<div class="success-note" style="background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink)">מצב הדגמה — לא נשלח דבר לשרת</div>' +
      '<button class="new-btn" onclick="location.reload()">הזמנה חדשה</button>' +
    '</div>';
}

// ── toast / overlays ──
function toast(msg, withUndo) {
  const el = document.getElementById('toast');
  el.innerHTML = '<span></span>' + esc(msg) + (withUndo ? '<button class="toast-undo" onclick="undoRemove()">בטל</button>' : '');
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), withUndo ? 4000 : 1800);
}
function clearToast() { clearTimeout(toastTimer); document.getElementById('toast').classList.remove('on'); }

// Styled in-page confirmation (replaces the native confirm(), which shows browser chrome + English
// buttons). Returns a Promise<boolean>. Only one is ever open at a time.
function askConfirm(opts) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    confirmEntry = { back: () => rawResolveConfirm(false) };
    openOverlay(confirmEntry);
    const el = document.getElementById('confirm');
    el.className = 'confirm-backdrop';
    el.innerHTML =
      '<div class="confirm-card" onclick="event.stopPropagation()">' +
        '<div class="confirm-ico"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke-linejoin="round" stroke-linecap="round"></path></svg></div>' +
        '<div class="confirm-title">' + esc(opts.title) + '</div>' +
        '<div class="confirm-msg">' + esc(opts.msg) + '</div>' +
        '<div class="confirm-btns">' +
          '<button class="confirm-yes" onclick="resolveConfirm(true)">' + esc(opts.yes) + '</button>' +
          '<button class="confirm-no" onclick="resolveConfirm(false)">' + esc(opts.no) + '</button>' +
        '</div>' +
      '</div>';
    el.setAttribute('onclick', 'confirmBackdrop(event)');
  });
}
function rawResolveConfirm(v) {
  const el = document.getElementById('confirm');
  el.classList.add('hidden');
  el.setAttribute('onclick', '');
  el.innerHTML = '';
  const r = confirmResolve; confirmResolve = null;
  if (r) r(v);
}
function resolveConfirm(v) { const e = confirmEntry; confirmEntry = null; rawResolveConfirm(v); unwindOverlay(e); }
function confirmBackdrop(e) { if (e.target === e.currentTarget) resolveConfirm(false); }
function showPosting(text) { const t = document.getElementById('posting-text'); if (t && text) t.textContent = text; document.getElementById('posting').classList.remove('hidden'); }
function hidePosting() { document.getElementById('posting').classList.add('hidden'); }
// Fatal / blocking screen — replaces the whole app (bad token, load error, closed window).
function fatal(msg) {
  document.getElementById('boot').classList.add('hidden');
  const app = document.getElementById('app');
  app.classList.remove('hidden');
  app.innerHTML = '<div class="errbox"><div class="ei">⚠</div><div class="errbox-text">' + esc(msg) + '</div></div>';
}

init();
</script>
