<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>הזמנה · תצוגת תמונות</title>
<!-- ─────────────────────────────────────────────────────────────────────────────
     EXPERIMENTAL COPY of /order/index.html — image-first catalog.
     Differences from the live page (everything else is identical behaviour):
       • the product list is a horizontal PAGER: 10 products per page, 2 columns × 5 rows
       • pages snap sideways; ~28px of the neighbouring page always peeks so the
         customer can see there is more to explore; dots below show position
       • each product card leads with a photo (falls back to the tinted initial)
     Image source is resolved by convention — see the IMAGES block in the script.
     ───────────────────────────────────────────────────────────────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7efea; --app:#f5f8f6; --surface:#fff;
  --ink:#0d1f18; --ink-2:#3f574c; --ink-3:#536b60; --ink-4:#a8bcb1;
  --line:#dde8e2; --line-2:#c7dbd0;
  --green:#0f4834; --green-deep:#082419; --green-mid:#0c3b2b;
  --wa:#25d366; --wa-ink:#04220f; --wa-deep:#0c7a45; --wa-soft:#eafaf0; --wa-line:#b7e8ca;
  --amber-bg:#fdf4e3; --amber-line:#f0dcae; --amber-line-2:#ecca8a; --amber-ink:#8a5a12;
  --danger:#d64545; --danger-bg:#fdeeee; --danger-line:#f0c2c2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);min-height:100vh}
body{font-family:'Heebo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input{font-family:inherit}
input[type=search]::-webkit-search-cancel-button{display:none}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}
@keyframes om-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes om-sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes om-fade{from{opacity:0}to{opacity:1}}
@keyframes om-pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes om-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.phone{max-width:440px;margin-inline:auto;min-height:100vh;background:var(--app);position:relative;box-shadow:0 0 60px rgba(12,59,43,.14);overflow:hidden}

/* header */
.hdr{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--line)}
.hdr-logo{width:42px;height:42px;flex:none;border-radius:12px;background:linear-gradient(155deg,var(--green),var(--green-deep));display:grid;place-items:center;box-shadow:0 2px 8px rgba(12,59,43,.25)}
.hdr-logo span{font-family:'Plus Jakarta Sans';font-weight:800;color:#fff;font-size:19px}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-status{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:1px}
.hdr-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 3px rgba(37,211,102,.18)}
.badge{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border-radius:12px;background:#f0f6f2;color:var(--ink-2)}
.badge.on{background:var(--green-mid);color:#fff}
.badge svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.badge-count{position:absolute;top:-4px;left:-4px;background:var(--wa);color:var(--wa-ink);min-width:20px;height:20px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.badge:not(.on) .badge-count{display:none}

/* clarify box */
.clarify-box{margin:12px 14px 0;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:16px;overflow:hidden}
.clarify-head{display:flex;align-items:center;gap:9px;padding:12px 14px 10px;font-weight:800;font-size:13.5px;color:var(--amber-ink)}
.clarify-head svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.clarify-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--amber-line)}
.clarify-row-label{font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clarify-cta{flex:none;background:#fff;color:var(--amber-ink);border:1px solid var(--amber-line-2);padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:800}

/* search — tighter than the live page: every pixel above the pager is a pixel off the photos */
.searchbar{padding:9px 14px 3px}
.searchbar-inner{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 13px;box-shadow:0 1px 2px rgba(12,59,43,.04)}
.searchbar-inner svg{width:19px;height:19px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search-input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink);padding:0}
.search-input::placeholder{color:var(--ink-4)}
.search-clear{width:26px;height:26px;flex:none;border-radius:50%;background:#eef3f0;color:var(--ink-2);font-size:16px;display:grid;place-items:center}

/* tabs + pills */
/* Market types (+ favourites) = folder-style TABS: the active tab is raised, matches the content
   plane below and is outlined; inactive tabs sit recessed behind the baseline. Clearly distinct
   from the rounded category pills underneath. */
.tabs{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 16px 10px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--ink-3);background:#e7eeea;border:1px solid var(--line);border-bottom:none;border-radius:11px 11px 0 0}
.tab.on{background:var(--app);color:var(--green);font-weight:800;border-color:var(--line-2);margin-bottom:-1px;padding-bottom:12px;box-shadow:0 -2px 6px rgba(12,59,43,.05)}
.tab-dot{width:6px;height:6px;border-radius:50%;background:#e8a53a}
.tab.on .tab-dot{display:none}
/* Categories = filter PILLS (rounded chips) — deliberately different from the tabs above. */
.cats{display:flex;gap:7px;overflow-x:auto;padding:8px 14px 2px}
.pill{flex:none;padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.pill.on{background:var(--green);color:#fff;border-color:var(--green)}

/* hero — one compact row here rather than the live page's stacked card: the height it used to take
   came straight out of the product photos below it */
.hero{margin:8px 14px 0;background:var(--wa-soft);border:1px solid var(--wa-line);border-radius:14px;
  padding:8px 10px 8px 12px;display:flex;align-items:center;gap:10px}
.hero-kick{display:none}
.hero-line{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-btn{flex:none;background:#fff;color:var(--wa-deep);border:1.5px solid var(--wa-line);border-radius:10px;
  height:34px;padding:0 14px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
.hero-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4}
.hero-btn:active{background:var(--wa-soft)}
/* adopted → the same button undoes it, in red */
.hero-btn.danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.hero-btn.danger:active{background:#f9dede}

/* ── PAGER: 10 products per page (2 cols × 5 rows), pages snap sideways ──
   The pager's height AND how many products a page holds are measured in JS (computeLayout), so a
   whole page always fits the screen — sideways swiping is the only way through the catalog.
   Peek: the container is padded 14px while a page is (100% − 54px) wide, so ~28px of
   the neighbouring page stays visible — the affordance that says "there's more". */
.pager{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:8px 14px 2px;scroll-padding-inline:14px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.page{flex:0 0 calc(100% - 54px);min-width:0;display:flex;flex-direction:column;
  scroll-snap-align:start;scroll-snap-stop:always;opacity:.5;transition:opacity .22s ease}
.page.active{opacity:1}
.page-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px;min-height:20px}
.page-title{font-size:13.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-meta{margin-inline-start:auto;flex:none;font-size:11px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums}
/* Row count and row height are both measured in JS (computeLayout): the grid holds exactly the
   rows that fit, and the cards grow to fill the leftover. Nothing here ever scrolls vertically —
   a page that doesn't fit is a page with fewer products on it, not a page you scroll. */
.page-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:var(--card-h,140px);gap:8px;overflow:hidden}
/* ?per= pins a count the screen may not fit — scroll rather than silently clip products away */
.pager.forced .page-grid{overflow-y:auto;overscroll-behavior-y:contain}
/* dots — position within the whole catalog, tappable. Fixed height so the maths above is stable. */
.pagedots{height:22px;display:flex;justify-content:center;align-items:center;gap:5px;padding:6px 14px 0;overflow:hidden}
.pdot{width:7px;height:7px;flex:none;border-radius:999px;background:var(--line-2);transition:all .22s ease}
.pdot.on{width:20px;background:var(--green)}
/* overlay, so the nudge costs the grid no height */
.swipe-hint{position:absolute;inset-inline:0;bottom:26px;text-align:center;pointer-events:none;
  font-size:11.5px;font-weight:700;color:var(--ink-3);animation:om-fade .4s ease}
.swipe-hint span{background:rgba(245,248,246,.92);padding:3px 12px;border-radius:999px}

/* product card — the photo takes every pixel the name and the button don't need. The product code
   and the "מוצע" tag sit ON the photo rather than on their own lines, which is what buys the photo
   its height in a card this short. */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;
  display:flex;flex-direction:column;gap:4px;min-height:0;min-width:0;overflow:hidden}
.pcard.has-qty{border:1.5px solid #9fdfba;box-shadow:0 4px 14px rgba(37,211,102,.12)}
.pthumb{position:relative;flex:1;min-height:56px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
/* The tinted initial always sits in the thumb; the photo lies on top and fades in over it. So a
   product with no photo, one whose photo is still loading, and one whose photo 404s all look
   deliberate rather than broken — and there is never a white flash. */
.pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--fit,cover);display:block;
  transform:scale(var(--zoom,1));opacity:0;transition:opacity .18s ease}
.pthumb img.on{opacity:1}
.pinitial{font-family:'Plus Jakarta Sans';font-weight:800;font-size:26px;line-height:1}
.pqty-badge{position:absolute;top:4px;inset-inline-end:4px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;
  background:var(--wa);color:var(--wa-ink);font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;font-variant-numeric:tabular-nums}
.ptag{position:absolute;top:4px;inset-inline-start:4px;font-size:10px;font-weight:800;color:var(--amber-ink);
  background:var(--amber-bg);padding:2px 7px;border-radius:999px;border:1px solid var(--amber-line)}
.pcode{position:absolute;bottom:3px;inset-inline-start:4px;font-size:9px;font-family:ui-monospace,Menlo,monospace;
  color:var(--ink-4);background:rgba(255,255,255,.72);padding:1px 4px;border-radius:999px;letter-spacing:-.02em}
.pname{flex:none;height:28px;font-size:11.5px;font-weight:600;line-height:1.22;padding:0 2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add-btn{width:100%;height:32px;flex:none;background:var(--wa-soft);color:var(--wa-deep);border:1.5px solid var(--wa-line);
  border-radius:10px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px}
.add-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.qbtn{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:19px;font-weight:500}
.qbtn.minus{border:1.5px solid var(--line-2);background:#fff;color:var(--ink-2)}
.qbtn.plus{border:1.5px solid var(--wa);background:var(--wa);color:#fff}
.qnum{flex:1;min-width:0;height:32px;padding:0 4px;font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;display:grid;place-items:center;border-radius:8px;background:#f0f6f2}
/* the clarify box + cart keep the roomier controls of the live page */
.clarify-row .qbtn,.crow-ctrls .qbtn{width:40px;height:40px;border-radius:11px;font-size:20px}
.clarify-row .qnum,.crow-ctrls .qnum{flex:none;min-width:40px;height:40px;font-size:16px}
/* ── LIST layout — for orgs with few or no photos. A grid of letter tiles reads as broken;
   a list with a thumbnail where one exists reads as a catalog. Same cards, same actions. */
.list{padding-bottom:150px}
.group{margin-top:12px}
.group-head{padding:4px 18px 6px;display:flex;align-items:baseline;gap:8px}
.group-title{font-size:15px;font-weight:800;letter-spacing:-.01em}
.group-meta{font-size:12px;color:var(--ink-3);font-weight:600}
.lcard{background:var(--surface);margin:0 14px 8px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line)}
.lcard.has-qty{border:1.5px solid #9fdfba;box-shadow:0 4px 14px rgba(37,211,102,.12)}
.lthumb{position:relative;width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.lthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(var(--zoom,1));opacity:0;transition:opacity .18s ease}
.lthumb img.on{opacity:1}
.linfo{flex:1;min-width:0}
.lname{font-size:14px;font-weight:600;line-height:1.3;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{display:flex;align-items:center;gap:8px;margin-top:3px}
.lsku{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace}
.ltag{font-size:10.5px;font-weight:800;color:var(--amber-ink);background:var(--amber-bg);padding:2px 8px;border-radius:999px;border:1px solid var(--amber-line)}
/* the list has room for the live page's full-size controls */
.lcard .pcard-action{flex:none}
.lcard .add-btn{width:auto;height:42px;padding:0 18px;font-size:14px;border-radius:12px}
.lcard .stepper{gap:4px}
.lcard .qbtn{width:42px;height:42px;border-radius:12px;font-size:21px}
.lcard .qnum{flex:none;min-width:40px;height:42px;font-size:17px}
.empty-list{text-align:center;padding:60px 24px;color:var(--ink-3)}
.empty-list-ico{width:56px;height:56px;border-radius:50%;background:#eef3f0;display:grid;place-items:center;margin:0 auto 12px}
.empty-list-ico svg{width:24px;height:24px;stroke:var(--ink-4);fill:none;stroke-width:1.7}
.empty-list-text{font-weight:600;color:var(--ink-2)}

/* sticky bottom bar (catalog) */
.catalog-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--app) 78%,rgba(245,248,246,0));z-index:120}
.bar-btn{width:100%;padding:15px 18px;border-radius:14px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;background:#e3ede8;color:#7d968b}
.bar-btn.on{background:var(--green-mid);color:#fff;box-shadow:0 8px 20px rgba(12,59,43,.28)}
.bar-btn-left{display:flex;align-items:center;gap:10px}
.bar-btn-count{background:rgba(255,255,255,.22);min-width:24px;height:24px;padding:0 7px;border-radius:999px;font-size:13px;font-weight:800;display:grid;place-items:center}

/* cart */
.cart-hdr{background:var(--surface);padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:90;border-bottom:1px solid var(--line)}
.cart-back{display:flex;align-items:center;gap:5px;color:var(--wa-deep);font-weight:700;font-size:14px;padding:6px 4px}
.cart-back .arr{font-size:19px}
.cart-title{font-size:16px;font-weight:800;margin-inline-start:2px}
.cart-sum{margin-inline-start:auto;font-size:12.5px;color:var(--ink-3);font-weight:600}
.deadline{margin:12px 14px 0;padding:11px 13px;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:12px;font-size:12.5px;font-weight:700;color:var(--amber-ink);display:flex;align-items:center;gap:8px}
.deadline::before{content:"⏳";flex:none}
.deadline.expired{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}
.deadline.expired::before{content:"🔒"}
#cart-items{padding-bottom:170px}
.cart-empty{text-align:center;padding:70px 30px}
.cart-empty-ico{width:64px;height:64px;border-radius:50%;background:#eef3f0;display:grid;place-items:center;margin:0 auto 14px}
.cart-empty-ico svg{width:28px;height:28px;stroke:var(--ink-4);fill:none;stroke-width:1.6}
.cart-empty-title{font-size:15px;font-weight:700;color:var(--ink-2)}
.cart-empty-sub{font-size:13px;color:var(--ink-3);margin-top:6px;text-wrap:pretty}
.cart-empty-btn{margin-top:18px;background:var(--wa);color:var(--wa-ink);font-weight:800;font-size:14px;padding:12px 24px;border-radius:12px}
.cart-group{margin-top:14px}
.cart-group-title{padding:2px 18px 6px;font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.07em;display:flex;align-items:center;gap:8px}
.cart-group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.crow{background:var(--surface);margin:0 14px 7px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px}
.crow-info{flex:1;min-width:0}
.crow-name{font-size:14px;font-weight:600}
.crow-sku{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.crow-ctrls{display:flex;align-items:center;gap:4px;flex:none}
.crow-ctrls .qbtn{width:40px;height:40px;border-radius:11px;font-size:20px}
.crow-ctrls .qnum{min-width:36px;height:40px;padding:0 5px;font-size:16px}
.rm-btn{width:36px;height:40px;display:grid;place-items:center;margin-inline-start:2px}
.rm-btn svg{width:19px;height:19px;stroke:var(--danger);fill:none;stroke-width:1.8}
.suggest{margin:22px 14px 0;border-top:1px dashed var(--line-2);padding-top:16px}
.suggest-head{display:flex;align-items:center;gap:8px;padding:0 4px 10px;font-size:14px;font-weight:800;color:var(--amber-ink)}
.suggest-head::before{content:"";width:7px;height:7px;border-radius:50%;background:#e8a53a}
.suggest-row{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:7px}
.suggest-info{flex:1;min-width:0}
.suggest-name{font-size:13.5px;font-weight:600}
.suggest-meta{font-size:11px;color:var(--amber-ink);font-weight:700;margin-top:2px}
.suggest-add{flex:none;background:#fff;color:var(--amber-ink);border:1.5px solid var(--amber-line-2);border-radius:999px;font-size:13px;font-weight:800;padding:8px 15px}
.cart-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--surface);border-top:1px solid var(--line);padding:12px 14px calc(16px + env(safe-area-inset-bottom));z-index:120;box-shadow:0 -6px 22px rgba(12,59,43,.07)}
.send-btn{width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--wa);color:var(--wa-ink);box-shadow:0 6px 18px rgba(37,211,102,.32)}
.send-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9}
.send-btn:disabled{background:#eef3f0;color:var(--ink-4);box-shadow:none}
.send-btn.danger{background:var(--danger);color:#fff;box-shadow:0 6px 18px rgba(214,69,69,.28)}
.clear-btn{width:100%;margin-top:8px;padding:10px;color:var(--danger);font-size:13px;font-weight:700}

/* success */
.success{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center}
.success-ico{width:90px;height:90px;border-radius:50%;background:var(--wa-soft);display:grid;place-items:center;animation:om-pop .45s cubic-bezier(.2,.9,.3,1.4) both}
.success-ico svg{width:44px;height:44px;stroke:var(--wa);fill:none;stroke-width:2.6}
.success-ico.neutral{background:#eef3f0}
.success-ico.neutral svg{stroke:var(--ink-2)}
.success-title{font-size:23px;font-weight:800;margin-top:22px;letter-spacing:-.01em}
.success-sum{font-size:14.5px;color:var(--ink-2);margin-top:8px;line-height:1.5;text-wrap:pretty}
.success-note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:20px;font-size:13.5px;color:var(--ink-2);font-weight:600;max-width:320px;text-wrap:pretty}
.wa-btn{margin-top:24px;width:100%;max-width:320px;background:var(--wa);color:var(--wa-ink);font-weight:800;font-size:15px;padding:15px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 18px rgba(37,211,102,.3)}
.wa-btn svg{width:20px;height:20px;fill:currentColor}
.new-btn{margin-top:12px;color:var(--ink-3);font-size:13.5px;font-weight:700;padding:8px}

/* sheets (keypad + clarify) */
.sheet-backdrop{position:fixed;inset:0;background:rgba(13,31,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000;animation:om-fade .2s ease}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:440px;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:om-sheet .28s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{max-height:82vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:2px auto 12px}
.keypad-name{text-align:center;font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keypad-val{text-align:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 4px;letter-spacing:-.02em}
/* still replaceable: shown selected, the way a highlighted field says "type to overwrite" */
.keypad-val.fresh{display:block;width:fit-content;margin-inline:auto;padding:0 14px;border-radius:12px;
  background:var(--wa-soft);color:var(--wa-deep);box-shadow:inset 0 0 0 1.5px var(--wa-line)}
.keypad-presets{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.kp-preset{background:var(--wa-soft);color:var(--wa-deep);border:1.5px solid var(--wa-line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kp-key{height:56px;border-radius:14px;font-size:22px;font-weight:700;color:var(--ink);background:var(--app);border:1px solid #e3ede8}
.kp-key.back{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger)}
.kp-key.blank{visibility:hidden}
.keypad-confirm{width:100%;margin-top:12px;background:var(--wa);color:var(--wa-ink);font-weight:800;font-size:16px;padding:15px;border-radius:13px}
.clarify-title{font-size:15.5px;font-weight:800;margin-bottom:4px;text-wrap:pretty}
.clarify-sub{font-size:13px;color:var(--ink-3);margin-bottom:12px}
.opt{width:100%;display:flex;align-items:center;gap:8px;padding:12px 10px;border-radius:12px;border:1px solid #eef3f0;background:#fff;margin-bottom:6px;text-align:start}
.opt.sel{border:1.5px solid #9fdfba;background:#f3fbf6}
.opt-mark{width:30px;flex:none;text-align:center;color:var(--wa-deep);font-size:20px}
.opt-check{width:24px;height:24px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;background:#fff;border:2px solid var(--line-2)}
.opt.sel .opt-check{background:var(--wa);border-color:var(--wa)}
.opt-info{flex:1;min-width:0}
.opt-name{font-size:14.5px;font-weight:600}
.opt-meta{font-size:11px;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.var-confirm{width:100%;margin-top:12px;background:var(--wa);color:var(--wa-ink);font-weight:800;font-size:15px;padding:14px;border-radius:13px}
.drop-btn{width:100%;margin-top:12px;padding:14px;border-radius:12px;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2)}
.drop-btn.danger{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger)}
.drop-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
.no-opts{text-align:center;padding:24px;color:var(--ink-3);font-size:13px}

/* confirmation dialog (replaces the native confirm()) */
.confirm-backdrop{position:fixed;inset:0;background:rgba(13,31,24,.5);display:flex;align-items:center;justify-content:center;z-index:1300;animation:om-fade .2s ease;padding:24px}
.confirm-card{background:var(--surface);border-radius:20px;max-width:360px;width:100%;padding:24px 22px 18px;text-align:center;box-shadow:0 20px 50px rgba(13,31,24,.3);animation:om-pop .3s cubic-bezier(.2,.9,.3,1.4) both}
.confirm-ico{width:56px;height:56px;border-radius:50%;background:var(--danger-bg);display:grid;place-items:center;margin:0 auto 14px}
.confirm-ico svg{width:26px;height:26px;stroke:var(--danger);fill:none;stroke-width:1.9}
.confirm-title{font-size:18px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.confirm-msg{font-size:14px;color:var(--ink-2);line-height:1.5;text-wrap:pretty}
.confirm-btns{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.confirm-yes{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:800;background:var(--danger);color:#fff}
.confirm-no{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;background:var(--app);color:var(--ink-2)}

/* toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;white-space:nowrap;z-index:2000;box-shadow:0 8px 24px rgba(13,31,24,.3);transition:all .25s cubic-bezier(.2,.8,.2,1);opacity:0;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wa);flex:none}
.toast-undo{color:#8fe6b5;font-weight:800;font-size:13px;margin-inline-start:6px}

/* overlays */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;color:var(--ink-3);font-size:13px}
.spinner{width:32px;height:32px;border:2.5px solid var(--line);border-top-color:var(--wa);border-radius:50%;animation:om-spin .75s linear infinite}
.posting{position:fixed;inset:0;z-index:1500;background:rgba(245,248,246,.94);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink-2);font-size:15px;font-weight:700;text-align:center;padding:0 32px}
.posting .spinner{width:38px;height:38px;border-width:3px}
.errbox{text-align:center;padding:60px 28px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-2)}
.errbox .ei{font-size:32px;margin-bottom:12px}
.errbox-text{font-size:15px;font-weight:600;text-wrap:pretty}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- loading / error take over the whole app on first load or fatal error -->
  <div id="boot" class="loading"><div class="spinner"></div>טוען קטלוג...</div>

  <div id="app" class="hidden">
    <!-- HEADER -->
    <div class="hdr" id="header">
      <div class="hdr-logo"><span id="hdr-initial">·</span></div>
      <div class="hdr-info">
        <div class="hdr-name" id="hdr-name">טוען...</div>
        <div class="hdr-status">מחובר לוואטסאפ</div>
      </div>
      <button class="badge" id="badge" onclick="onBadge()" aria-label="עגלה">
        <svg viewBox="0 0 24 24"><path d="M3 6h18l-2 11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L3 6z" stroke-linejoin="round"></path><path d="M8 6V4a4 4 0 0 1 8 0v2"></path></svg>
        <span class="badge-count" id="badge-count">0</span>
      </button>
    </div>

    <!-- CATALOG -->
    <div id="catalog-view">
      <div id="clarify-box" class="clarify-box hidden"></div>
      <div class="searchbar">
        <div class="searchbar-inner">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="search-input" class="search-input" type="text" inputmode="search" enterkeyhint="search" placeholder="חיפוש מוצר, מק״ט או ברקוד…" oninput="onSearch(this.value)" autocomplete="off">
          <button id="search-clear" class="search-clear hidden" onclick="clearSearch()" aria-label="נקה">×</button>
        </div>
      </div>
      <div id="tabs" class="tabs"></div>
      <div id="cats" class="cats hidden"></div>
      <div id="hero" class="hidden"></div>
      <div id="plist" style="position:relative">
        <!-- grid layout (photos) -->
        <div id="pager" class="pager"></div>
        <div id="pagedots" class="pagedots"></div>
        <div id="swipe-hint" class="swipe-hint hidden"><span>← החליקו הצידה לעוד מוצרים</span></div>
        <!-- list layout (few or no photos) — the live page's vertical list, with a thumbnail
             where one exists. Chosen automatically per org; see resolveLayout(). -->
        <div id="list" class="list hidden"></div>
      </div>
      <div class="catalog-bar" id="catalog-bar">
        <button class="bar-btn" id="bar-btn" onclick="goCart()">בחר מוצרים כדי להתחיל</button>
      </div>
    </div>

    <!-- CART -->
    <div id="cart-view" class="hidden">
      <div class="cart-hdr">
        <button class="cart-back" onclick="goCatalog()"><span class="arr">→</span>לקטלוג</button>
        <span class="cart-title">העגלה שלי</span>
        <span class="cart-sum" id="cart-sum"></span>
      </div>
      <div id="cart-deadline" class="deadline hidden"></div>
      <div id="cart-items"></div>
      <div class="cart-bottom" id="cart-bottom"></div>
    </div>
  </div>

  <!-- sheets + toast live outside the views so they overlay everything -->
  <div id="keypad" class="hidden"></div>
  <div id="clarify" class="hidden"></div>
  <div id="confirm" class="hidden"></div>
  <div id="posting" class="posting hidden"><div class="spinner"></div><span id="posting-text">שולח את ההזמנה...</span></div>
  <div id="toast" class="toast"><span></span></div>
</div>

<script>
// ── Point each deployed page at its matching backend by hostname ──
// order-dev.ordexai.com → dev API; everything else (order.ordexai.com) → prod API.
const API = location.hostname === 'order-dev.ordexai.com'
  ? 'https://9q6xovizff.execute-api.eu-west-1.amazonaws.com'   // dev
  : 'https://nbe30y2d7e.execute-api.eu-west-1.amazonaws.com';  // prod

// Avatar tints per category CODE (real categories carry no colours). Fallback = OTHER.
const CAT_COLORS = {
  MOZZARELLA:{bg:'#fef3e6',fg:'#b46a1e'}, WHITE_BRINE:{bg:'#eef4fb',fg:'#2f6bb0'},
  HARD_CHEESE:{bg:'#fdf2d9',fg:'#a67d15'}, CREAM_CHEESE:{bg:'#f3eefb',fg:'#7a4fb0'},
  RICOTTA:{bg:'#f7f0fb',fg:'#8a4fa0'}, HALLOUMI:{bg:'#f1f7e8',fg:'#5a7a24'},
  GOAT_SHEEP:{bg:'#fbeaea',fg:'#b4453e'}, CREAM:{bg:'#f3eefb',fg:'#7a4fb0'},
  YOGURT:{bg:'#eafaf0',fg:'#0c7a45'}, MILK:{bg:'#eaf6fb',fg:'#2b7fa3'},
  BUTTER:{bg:'#fdf2d9',fg:'#a67d15'}, DESSERTS:{bg:'#fbeaf3',fg:'#b03a78'},
  PASTA:{bg:'#fdf4e3',fg:'#8a5a12'}, SPREADS:{bg:'#f1f7e8',fg:'#5a7a24'},
  OTHER:{bg:'#eef3f0',fg:'#3f574c'},
};

// ══════════════════ IMAGES ══════════════════
// Product photos are resolved BY CONVENTION from a public bucket — no DB column, no backend
// change: drop a file named after the SKU code into the org's folder and it appears.
//
//   {IMG_BASE}/{orgId}/{sku_code}.{IMG_EXT}
//
// mirroring the existing tutorial-videos bucket layout (src/utils/welcomeVideo.js).
// A missing/broken image falls back to the tinted category initial — never a broken-image icon.
//
// Test-page overrides (query string, so nothing needs redeploying to try another source):
//   ?img=<baseUrl>   point at any host / local folder      (default: the Supabase bucket below)
//   ?org=<uuid>      the per-org folder segment            (omit → files sit flat in the bucket)
//   ?imgext=jpg      file extension                        (default: webp)
//
// OFFLINE DEMO (?demo=…) — no backend, no token, nothing is sent anywhere. Run demo-server.js.
//   ?demo=ariel      the Ariel Bakery catalog with its real product photos
//   ?demo=tiles      the same catalog with generated placeholder tiles instead of photos
//   ?clarify=1       also open with clarification / "מכל סוג" questions pending
const Q         = new URLSearchParams(location.search);
const IMG_BASE  = (Q.get('img') || 'https://noxzdedrjbepwakcdsfh.supabase.co/storage/v1/object/public/product-images').replace(/\/+$/, '');
const IMG_ORG   = Q.get('org') || '';
const IMG_EXT   = (Q.get('imgext') || 'webp').replace(/^\./, '');
const DEMO      = (Q.get('demo') || '').toLowerCase();        // '' = live page against the real API
const DEMO_ON   = DEMO !== '';
const IMG_DEMO  = DEMO === 'tiles' || DEMO === '1';           // draw tiles instead of loading files
const DEMO_SET  = IMG_DEMO ? 'ariel' : DEMO;                  // which dataset to load offline
// ?img=/?org= means "I am pointing this at a bucket on purpose" — assume every product has a photo
// there, since the page has no other way to know and the whole point is to look at that bucket.
const BUCKET_TEST = !!(Q.get('img') || Q.get('org'));
const CAT_EMOJI = {
  MOZZARELLA:'🧀', WHITE_BRINE:'🧀', HARD_CHEESE:'🧀', CREAM_CHEESE:'🥛', RICOTTA:'🥣',
  HALLOUMI:'🧀', GOAT_SHEEP:'🐐', CREAM:'🥛', YOGURT:'🥛', MILK:'🥛', BUTTER:'🧈',
  DESSERTS:'🍮', PASTA:'🍝', SPREADS:'🥄', OTHER:'📦',
};

function imageUrl(code) {
  if (IMG_DEMO) return demoTile(code);
  const s = findSku(code);
  if (s && s.image) return s.image;      // catalog data carries an explicit path per product
  const folder = IMG_ORG ? encodeURIComponent(IMG_ORG) + '/' : '';
  return IMG_BASE + '/' + folder + encodeURIComponent(code) + '.' + IMG_EXT;
}
// Does this product have a photo we KNOW about? Only the backend can answer that — the page must
// never probe the bucket per SKU. Anything else is a guess, and a grid full of guesses that 404
// is worse than no grid at all.
function hasImage(code) {
  if (IMG_DEMO || BUCKET_TEST) return true;
  const s = findSku(code);
  return !!(s && s.image);
}

// ── layout: photos or no photos ────────────────────────────────────────────
// Not every org will have product photos, and the ones that do will build them up gradually. A
// photo grid whose tiles are mostly letters looks broken, so the layout follows the data:
//   coverage ≥ MIN_COVERAGE → grid (this page)     below it → list (the live page's layout)
// An org can pin either one via catalog.catalogLayout ('grid' | 'list' | 'auto'), which is what a
// per-org column should drive in production. ?layout= overrides everything, for comparing.
const MIN_COVERAGE = Math.min(1, Math.max(0, parseFloat(Q.get('mincov')) || 0.7));
const LAYOUT_Q     = (Q.get('layout') || '').toLowerCase();

function imageCoverage() {
  if (IMG_DEMO || BUCKET_TEST) return 1;
  const list = (catalog && catalog.skus) || [];
  if (!list.length) return 0;
  let withImage = 0;
  list.forEach(s => { if (s.image) withImage++; });
  return withImage / list.length;
}
function resolveLayout() {
  if (LAYOUT_Q === 'grid' || LAYOUT_Q === 'list') return LAYOUT_Q;
  const pinned = catalog && catalog.catalogLayout;
  if (pinned === 'grid' || pinned === 'list') return pinned;
  return imageCoverage() >= MIN_COVERAGE ? 'grid' : 'list';
}
// Placeholder "photo" (?demo=1): category-tinted gradient + emoji, deterministic per SKU.
function demoTile(code) {
  const s = findSku(code);
  const cat = s && findCat(s.category_id);
  const col = CAT_COLORS[cat && cat.code] || CAT_COLORS.OTHER;
  const emoji = CAT_EMOJI[cat && cat.code] || CAT_EMOJI.OTHER;
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + col.bg + '"/><stop offset="1" stop-color="#ffffff"/>' +
    '</linearGradient></defs>' +
    '<rect width="200" height="200" fill="url(#g)"/>' +
    '<text x="100" y="118" font-size="72" text-anchor="middle">' + emoji + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
// A photo that fails to load is simply removed — the tinted initial is already behind it.
function imgFail(img) { img.remove(); }

// ── State ──
// Products per page is MEASURED, not fixed: 2 columns × as many rows as the screen actually holds,
// capped at 10. A fixed count would mean a page taller than the screen on a phone, which brings
// back vertical scrolling — the thing paging sideways is meant to replace. So the page always fits,
// and the number of pages varies with the device instead.
const MAX_PER_PAGE = 10;
const FORCED_PER   = Math.max(0, parseInt(Q.get('per'), 10) || 0);     // ?per= pins it, for comparing
const MIN_CARD_H   = Math.max(90, parseInt(Q.get('card'), 10) || 140); // below this a photo stops reading
const MIN_ROWS     = 2;                                                // never fewer than 4 per page
const GAP = 8, PAGE_HEAD_H = 26, PAGER_PAD = 10, DOTS_H = 22;          // fixed parts of the layout maths
const IMG_FIT    = (Q.get('fit') === 'contain') ? 'contain' : 'cover'; // how a photo fills its box
// Zoom compensates for loosely-framed source photos: the Ariel shots are landscape studio images
// with the product small and centred in a large white field, so the card crops into the middle.
// Photos shot to spec — square, tight — want zoom 1. ?zoom= overrides; the dataset sets its own.
const IMG_ZOOM   = parseFloat(Q.get('zoom')) || null;
let pageIndex = 0;            // active page in the pager
let pagerObserver = null;     // IntersectionObserver tracking which page is on screen
let pagerSig = null;          // tab|category|search of the rendered pager — page index survives a re-render of the same list
// Each category remembers its own page. Leaving "מאפים מתוקים" on page 3 and coming back to it
// should land on page 3, while switching to a different category starts that category at its own
// page 1 — one shared index made the second category open on a page the customer never chose.
let pageMemory = Object.create(null);   // "tab|cat|search" -> page index
let idleWarm = null;          // handle for the background photo warm-up (see warmGroup)
let pageSize = MAX_PER_PAGE;  // products per page as last measured (see computeLayout)
let hintShown = false;        // the "swipe sideways" nudge is shown once per session
let catalog = null;
let qty = {};                 // sku_code -> quantity
let activeView = 'catalog';
let activeTab = null;
let activeCat = null;
let searchQuery = '';
let unmatchedItems = [];      // open clarification items (server) — spliced as resolved
let allVariantsItems = [];    // open "מכל סוג" items (server) — spliced as resolved
let needsQty = new Set();     // sku_codes whose handwritten qty was unreadable from an image — confirm on page
let needsQtyTimers = {};      // sku_code -> debounce timer: auto-confirm ~1s after the last qty tap
let resolvedAliases = [];     // raw customer text -> chosen sku (learned as contact aliases)
let droppedUnmatched = [];    // raw texts the customer marked "not in the list"
let editUntilEpoch = null;    // edit deadline (unix seconds); null for new orders
let keypad = null;            // { code } while the numeric sheet is open
let keypadBuf = '';
let keypadFresh = true;       // the keypad opens in overwrite mode: the first digit replaces the qty
let adoptedSnapshot = null;   // qty before "adopt" ran — non-null means the hero button shows "reset"
let clarify = null;           // { kind:'unmatched'|'variants', idx }
let variantSel = {};          // sku_code -> true (checkbox multi-select)
let lastRemoved = null;       // { code, qty } for the undo toast
let pendingRequestId = null;  // reused across retries so the backend dedupes
let confirmResolve = null;    // pending resolve() for the custom confirm dialog
let toastTimer = null, deadlineTimer = null;

// ── Overlay ↔ hardware Back integration ──────────────────────────────
// Each open overlay owns one throwaway history entry. Hardware/OS Back (Android),
// the iOS swipe-back gesture, and the in-app browser back arrow all fire popstate
// → we close the top overlay instead of leaving the page. Programmatic closes
// (backdrop tap / action buttons) hide immediately, then unwind their own history
// entry with a guard flag so popstate is a no-op for them.
const overlayStack = [];       // entries: { back: fn }  (back = hardware-Back behavior)
let overlayUnwinding = false;  // true while WE call history.back() ourselves
let clarifyEntry = null, keypadEntry = null, confirmEntry = null;

function openOverlay(entry) {
  overlayStack.push(entry);
  history.pushState({ omOverlay: overlayStack.length }, '');
}
function unwindOverlay(entry) { // remove entry + drop its history slot, no re-close
  const i = overlayStack.lastIndexOf(entry);
  if (i === -1) return;         // already gone (e.g. hardware Back handled it)
  overlayStack.splice(i, 1);
  overlayUnwinding = true;
  history.back();
}
window.addEventListener('popstate', function () {
  if (overlayUnwinding) { overlayUnwinding = false; return; } // our own unwind — ignore
  const entry = overlayStack.pop();                           // hardware/OS Back
  if (entry) entry.back();
});

// ── offline demo data ──
// Loaded as a plain <script> rather than fetch() so the demo also works when the file is opened
// straight off disk (file:// blocks fetch of local files, but not script tags).
function loadDemoCatalog(name) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'demo/' + encodeURIComponent(name) + '-catalog.js';
    s.onload  = () => window.DEMO_CATALOG ? resolve(window.DEMO_CATALOG) : reject(new Error('empty dataset'));
    s.onerror = () => reject(new Error('cannot load ' + s.src));
    document.head.appendChild(s);
  });
}

// Keep a stable, evenly-spread subset of products photographed (same set on every reload).
function applyDemoCoverage(percent) {
  const keep = code => {
    let h = 0;
    for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) % 1000;
    return (h % 100) < percent;
  };
  (catalog.skus || []).forEach(s => { if (!keep(s.sku_code)) s.image = null; });
  (catalog.favorites || []).forEach(f => { if (!keep(f.sku_code)) f.image = null; });
}

// ── boot ──
async function init() {
  if (DEMO_ON) {
    try {
      catalog = await loadDemoCatalog(DEMO_SET);
    } catch (e) {
      console.error(e);
      fatal('נתוני ההדגמה לא נטענו — הפעילו: node demo-server.js');
      return;
    }
    // ?clarify=1 → start with questions pending, so the demo shows that flow too.
    if (Q.get('clarify') === '1' && catalog._clarify) {
      catalog.unmatchedItems   = catalog._clarify.unmatchedItems || [];
      catalog.allVariantsItems = catalog._clarify.allVariantsItems || [];
    }
    // ?coverage=40 → drop the photos from 60% of the catalog, deterministically. Lets the
    // half-photographed org (the common real case) be looked at, not just imagined.
    const cov = parseInt(Q.get('coverage'), 10);
    if (!isNaN(cov)) applyDemoCoverage(Math.min(100, Math.max(0, cov)));
  } else {
  const token = new URLSearchParams(location.search).get('t');
  if (!token) { fatal('קישור לא תקין — חסר מזהה'); return; }
  try {
    const r = await fetch(API + '/catalog?token=' + encodeURIComponent(token));
    if (r.status === 401) { fatal('הקישור פג תוקף — בקש קישור חדש'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    catalog = await r.json();
  } catch (e) {
    console.error(e);
    fatal('שגיאה בטעינת הקטלוג. בדוק חיבור או נסה שוב.');
    return;
  }
  }

  unmatchedItems   = [...(catalog.unmatchedItems || [])];
  allVariantsItems = [...(catalog.allVariantsItems || [])];
  editUntilEpoch   = catalog.editUntilEpoch || null;

  if (Array.isArray(catalog.favorites)) {
    catalog.favorites.sort((a, b) => (b.suggested_qty || 0) - (a.suggested_qty || 0));
  }
  if (catalog.existingOrder) {
    catalog.existingOrder.forEach(it => {
      qty[it.sku_code] = it.quantity;
      if (it.needs_qty) needsQty.add(it.sku_code);   // image vision: SKU known, quantity to confirm
    });
  }

  const hasFavorites = catalog.favorites && catalog.favorites.length > 0;
  const hasSession   = catalog.existingOrder !== null;
  const hasClarify   = unmatchedItems.length > 0 || allVariantsItems.length > 0;
  const editMarket   = (hasSession && catalog.existingOrder.length > 0) ? catalog.existingOrder[0].market_type_id : null;
  if (editMarket && !hasClarify)      activeTab = editMarket;
  else if (hasFavorites)              activeTab = 'favorites';
  else                                activeTab = (catalog.marketTypes[0] || {}).id;
  // ?tab=favorites | <market code> | <market id> — open a given tab directly (testing convenience).
  const wantTab = Q.get('tab');
  if (wantTab) {
    if (wantTab === 'favorites' && hasFavorites) activeTab = 'favorites';
    else {
      const mt = catalog.marketTypes.find(m => String(m.id) === wantTab || m.code === wantTab || m.name === wantTab);
      if (mt) activeTab = mt.id;
    }
  }

  document.getElementById('hdr-name').textContent = catalog.org.name || '';
  document.getElementById('hdr-initial').textContent = (catalog.org.name || 'ר')[0];
  document.title = 'הזמנה — ' + (catalog.org.name || '');

  document.getElementById('boot').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  show('catalog');

  // Editing an order with nothing to clarify → open straight to the cart to review/change.
  if (catalog.existingOrder && catalog.existingOrder.length > 0 && !hasClarify) show('cart');

  if (editUntilEpoch) deadlineTimer = setInterval(applyEditDeadlineState, 30000);
}

// ── shared lookups ──
function findSku(code) {
  let s = catalog.skus.find(s => s.sku_code === code);
  if (s) return s;
  s = catalog.favorites && catalog.favorites.find(f => f.sku_code === code);
  if (s) return s;
  s = catalog.existingOrder && catalog.existingOrder.find(e => e.sku_code === code);
  if (s) return s;
  return { sku_code: code, name: code, market_type_id: null };
}
// Customer-facing product code: the maintained barcode when present, else the internal SKU code.
function displayCode(code) {
  const s = findSku(code);
  return (s && s.barcode) ? s.barcode : code;
}
function findCat(id) { return catalog.categories.find(c => c.id === id); }
function catColorForCode(code) {
  const s = findSku(code);
  const c = s && findCat(s.category_id);
  return CAT_COLORS[c && c.code] || CAT_COLORS.OTHER;
}
function marketName(id) {
  if (!id) return 'אחר';
  const m = catalog.marketTypes.find(m => String(m.id) === String(id));
  return m ? m.name : 'אחר';
}
// True when the page opened an EXISTING order to edit — confirmed (token has a sessionId) OR
// in-progress/unconfirmed (prefilled from the pending order → existingOrder populated). Only then can
// an empty cart mean "cancel this order". existingOrder is non-null only for a sessionId or a
// prefill-pending token, so this stays in lock-step with the backend cancel paths.
function isEditOrder() { return !!(catalog && (catalog.sessionId || catalog.existingOrder)); }
function isEditExpired() { return editUntilEpoch != null && (Date.now() / 1000) > editUntilEpoch; }
function units() { return Object.values(qty).reduce((a, b) => a + b, 0); }
function lines() { return Object.entries(qty).filter(([, q]) => q > 0); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function js(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

// ── view switching ──
function show(view) {
  activeView = view;
  document.getElementById('catalog-view').classList.toggle('hidden', view !== 'catalog');
  document.getElementById('cart-view').classList.toggle('hidden', view !== 'cart');
  if (view === 'catalog') renderCatalog();
  if (view === 'cart') { renderCart(); applyEditDeadlineState(); }
  window.scrollTo(0, 0);
}
function goCart() { if (lines().length || isEditOrder()) show('cart'); }
function goCatalog() { show('catalog'); }
function onBadge() { if (lines().length || isEditOrder()) show('cart'); }

// ══════════════════ CATALOG ══════════════════
function renderCatalog() {
  renderClarifyBox();
  const searching = !!searchQuery;
  document.getElementById('tabs').classList.toggle('hidden', searching);
  document.getElementById('cats').classList.toggle('hidden', searching || activeTab === 'favorites' || !activeTab);
  document.getElementById('hero').classList.toggle('hidden', searching || activeTab !== 'favorites' || catalog.existingOrder !== null);
  if (!searching) { renderTabs(); if (activeTab !== 'favorites') renderCats(); renderHero(); }
  renderProducts();
  updateBars();
}

// Grid or list, decided by how many products actually have a photo.
function renderProducts() {
  const grid = resolveLayout() === 'grid';
  document.getElementById('pager').classList.toggle('hidden', !grid);
  document.getElementById('pagedots').classList.toggle('hidden', !grid);
  document.getElementById('list').classList.toggle('hidden', grid);
  if (!grid) document.getElementById('swipe-hint').classList.add('hidden');
  if (grid) renderPager(); else renderList();
}

function renderClarifyBox() {
  const box = document.getElementById('clarify-box');
  const rows = [];
  unmatchedItems.forEach((u, i) => rows.push(
    '<div class="clarify-row"><span class="clarify-row-label">❓ ' + esc(u.text) + '</span>' +
    '<button class="clarify-cta" onclick="openClarify(\'unmatched\',' + i + ')">התאם</button></div>'));
  allVariantsItems.forEach((v, i) => rows.push(
    '<div class="clarify-row"><span class="clarify-row-label">🧀 ' + esc(v.keyword) + ' — מכל סוג</span>' +
    '<button class="clarify-cta" onclick="openClarify(\'variants\',' + i + ')">בחר סוגים</button></div>'));
  // Image vision: SKU known but the handwritten quantity was unreadable — confirm the qty inline here,
  // alongside the SKU-selection clarifications. Rows STAY put while editing (they don't vanish the
  // instant qty>0), so the customer can step up to the exact amount; ✓ marks a set quantity.
  [...needsQty].forEach(code => {
    const info = findSku(code);
    const q = qty[code] || 0;
    rows.push(
      '<div class="clarify-row"' + (q > 0 ? ' style="opacity:.72"' : '') + '><span class="clarify-row-label">' +
        (q > 0 ? '✓ ' : '✏️ ') + esc(info.name) + (q > 0 ? '' : ' — אשר כמות') + '</span>' +
      '<div class="stepper" style="flex:none">' +
        '<button class="qbtn minus" onclick="dec(\'' + js(code) + '\')" aria-label="הפחת">−</button>' +
        '<button class="qnum" onclick="openKeypad(\'' + js(code) + '\')">' + q + '</button>' +
        '<button class="qbtn plus" onclick="inc(\'' + js(code) + '\')" aria-label="הוסף">+</button>' +
      '</div></div>');
  });
  if (!rows.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.classList.remove('hidden');
  box.innerHTML =
    '<div class="clarify-head"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01" stroke-linecap="round"></path></svg>' +
    'צריך את העזרה שלך · ' + rows.length + '</div>' + rows.join('');
}

function renderTabs() {
  const el = document.getElementById('tabs');
  const tabs = [];
  if (catalog.favorites && catalog.favorites.length) {
    tabs.push({ id: 'favorites', label: 'הקבועים שלי', dot: true });
  }
  catalog.marketTypes.forEach(m => tabs.push({ id: m.id, label: m.name, dot: false }));
  el.innerHTML = tabs.map(t =>
    '<button class="tab' + (String(activeTab) === String(t.id) ? ' on' : '') + '" onclick="switchTab(\'' + js(t.id) + '\')">' +
    esc(t.label) + (t.dot ? '<span class="tab-dot"></span>' : '') + '</button>').join('');
}

// The category to auto-open for a market: the FIRST category in catalog.categories order
// (server sorts by sku_categories.sort_order) that has products in this market. Falls back to
// the SKU-derived order only if no catalog category matches.
function defaultCatId(catIds) {
  const first = catalog.categories.find(c => catIds.includes(c.id));
  return first ? first.id : catIds[0];
}

function renderCats() {
  const el = document.getElementById('cats');
  const inMkt = catalog.skus.filter(s => s.market_type_id === activeTab);
  const catIds = [...new Set(inMkt.map(s => s.category_id))];
  if (!catIds.length) { el.classList.add('hidden'); el.innerHTML = ''; activeCat = null; return; }
  if (!activeCat || !catIds.includes(activeCat)) activeCat = defaultCatId(catIds);
  el.classList.remove('hidden');
  el.innerHTML = catalog.categories.filter(c => catIds.includes(c.id)).map(c =>
    '<button class="pill' + (activeCat === c.id ? ' on' : '') + '" onclick="switchCat(\'' + js(c.id) + '\')">' + esc(c.name || c.code) + '</button>').join('');
}

function renderHero() {
  const el = document.getElementById('hero');
  if (searchQuery || activeTab !== 'favorites' || catalog.existingOrder !== null || !(catalog.favorites || []).length) {
    el.classList.add('hidden'); el.innerHTML = ''; return;
  }
  el.classList.remove('hidden');
  el.className = 'hero';
  // Adopted → the same button undoes it, in red. Tapping again re-adopts.
  const btn = adoptedSnapshot
    ? '<button class="hero-btn danger" onclick="resetAdopt()">' +
        '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
        'אפס כמויות</button>'
    : '<button class="hero-btn" onclick="adopt()">' +
        '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
        'אמץ כמויות</button>';
  el.innerHTML =
    '<div class="hero-line">' + catalog.favorites.length + ' מוצרים קבועים לפי ההרגל שלך</div>' + btn;
}

// Build the display groups for the current tab / category / search — unchanged from the live page.
// Returns { groups } or { empty: '<message>' }.
function buildGroups() {
  let groups = [];

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const m = catalog.skus.filter(s =>
      (s.name && s.name.toLowerCase().includes(q)) ||
      (s.sku_code && s.sku_code.toLowerCase().includes(q)) ||
      (s.barcode && s.barcode.toLowerCase().includes(q)));
    if (!m.length) return { empty: 'לא נמצאו מוצרים' };
    // Group search results by market type (מדף / מעדניה / …), ordered by the catalog's market order.
    const order = catalog.marketTypes.map(mt => String(mt.id));
    const byMkt = {};
    m.forEach(s => { const k = s.market_type_id != null ? String(s.market_type_id) : '__none__'; (byMkt[k] = byMkt[k] || []).push(s); });
    groups = Object.keys(byMkt)
      .sort((a, b) => (order.indexOf(a) < 0 ? 999 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 999 : order.indexOf(b)))
      .map(k => ({ title: k === '__none__' ? 'אחר' : (marketName(k) || 'אחר'), meta: byMkt[k].length + ' מוצרים',
        items: byMkt[k].map(s => ({ code: s.sku_code, name: s.name })) }));
  } else if (activeTab === 'favorites') {
    const showTag = catalog.existingOrder === null;   // suggested-qty tags only for new orders
    const byMkt = {};
    catalog.favorites.forEach(f => { (byMkt[f.market_type_id] = byMkt[f.market_type_id] || []).push(f); });
    groups = Object.entries(byMkt).map(([mkt, items]) => ({
      title: marketName(mkt), meta: items.length + ' מוצרים',
      items: items.map(f => ({ code: f.sku_code, name: f.name, suggested: showTag ? f.suggested_qty : 0 })),
    }));
  } else {
    const inMkt = catalog.skus.filter(s => s.market_type_id === activeTab);
    const catIds = [...new Set(inMkt.map(s => s.category_id))];
    if (!activeCat || !catIds.includes(activeCat)) activeCat = defaultCatId(catIds);
    const skus = inMkt.filter(s => s.category_id === activeCat);
    if (!skus.length) return { empty: 'אין מוצרים בקטגוריה זו' };
    const cat = findCat(activeCat);
    groups = [{ title: cat ? (cat.name || cat.code) : '', meta: marketName(activeTab) + ' · ' + skus.length + ' מוצרים',
      items: skus.map(s => ({ code: s.sku_code, name: s.name })) }];
  }

  return { groups };
}

// ── the pager: groups → pages of 10 (a group never shares a page with another group) ──
function renderPager() {
  const pager = document.getElementById('pager');
  const dots  = document.getElementById('pagedots');
  const hint  = document.getElementById('swipe-hint');
  const built = buildGroups();

  if (pagerObserver) { pagerObserver.disconnect(); pagerObserver = null; }
  // Measure BEFORE chunking — how many products a page holds is a property of the screen.
  const L = computeLayout();
  const prevSize = pageSize;
  pageSize = L.size;
  applyLayout(L);

  // Coming back from the cart re-renders the catalog — stay on the page the customer was on.
  // A different tab / category / search is a different list, so it resumes at ITS OWN remembered
  // page (first visit → page 1), not at the page index the previous category happened to be on.
  // A rotation changes how many fit, so the old index is rescaled to the new page size.
  const sig = [activeTab, activeCat, searchQuery].join('|');
  let restore = (sig === pagerSig) ? pageIndex : (pageMemory[sig] || 0);
  if (restore && prevSize !== pageSize) restore = Math.floor(restore * prevSize / pageSize);
  pagerSig = sig;
  pageIndex = 0;

  if (built.empty) {
    pager.innerHTML = '<div class="page active" style="flex:0 0 100%">' + emptyList(built.empty) + '</div>';
    dots.innerHTML = ''; hint.classList.add('hidden');
    return;
  }

  // Chunk each group into pages that fit. A partial page keeps the same grid so the cards never
  // change size between pages — only the empty slots differ.
  const pages = [];
  built.groups.forEach((g, gi) => {
    const total = Math.ceil(g.items.length / pageSize) || 1;
    for (let i = 0; i < g.items.length; i += pageSize) {
      pages.push({ title: g.title, items: g.items.slice(i, i + pageSize), part: (i / pageSize) + 1, total, group: gi });
    }
  });

  const start = Math.min(restore, pages.length - 1);
  pager.innerHTML = pages.map((p, i) =>
    '<section class="page' + (i === start ? ' active' : '') + '" data-i="' + i + '" data-g="' + p.group + '">' +
      '<div class="page-head"><span class="page-title">' + esc(p.title) + '</span>' +
        '<span class="page-meta">' + (p.total > 1 ? p.part + '/' + p.total : p.items.length + ' מוצרים') + '</span></div>' +
      '<div class="page-grid">' + p.items.map(it => productCard(it.code, it.name, it.suggested)).join('') + '</div>' +
    '</section>').join('');

  // Up to 10 pages → dots. Beyond that a dot row stops being readable → a compact counter.
  dots.innerHTML = pages.length <= 1 ? ''
    : pages.length <= 10
      ? pages.map((p, i) => '<button class="pdot' + (i === start ? ' on' : '') + '" onclick="goPage(' + i + ')" aria-label="עמוד ' + (i + 1) + '"></button>').join('')
      : '<span id="page-counter" class="page-meta">' + (start + 1) + ' / ' + pages.length + '</span>';

  // One-time nudge that the catalog continues sideways.
  hint.classList.toggle('hidden', hintShown || pages.length < 2);
  if (!hintShown && pages.length > 1) { hintShown = true; setTimeout(() => hint.classList.add('hidden'), 4000); }

  pageIndex = start;
  pageMemory[sig] = start;
  hydratePages(start);
  // ALWAYS position the scroller, including at page 0. Replacing innerHTML does NOT reset
  // scrollLeft on a horizontal scroll container, so switching category used to leave the pager
  // sitting at the previous category's offset — the observer then reported "3 / 5" for a list the
  // customer had just opened. scrollIntoView (not scrollLeft = 0) because the pager is RTL.
  goPage(start, 'auto');                  // jump (not animate) to where this list should open
  observePages();
  warmGroup(start);                       // background-load the rest of this category
}

// Fit one whole page on screen: pager height = what's left between it and the sticky bottom bar.
// Re-measured on every render and on resize/rotate, so the clarify box, tabs and hero appearing
// or disappearing never push the last row of products out of view.
// How much fits, right now. The height between the pager and the send bar decides how many rows
// a page gets — and therefore how many products are on it. Everything below the pager (the dots
// row) is a fixed height and the swipe hint is an overlay, so this measurement never chases itself.
function computeLayout() {
  const pager = document.getElementById('pager');
  const top   = pager.getBoundingClientRect().top;
  const barH  = document.getElementById('catalog-bar').offsetHeight || 76;
  // Floor = two floor-height rows. Normally there is more room than this and nothing scrolls; when
  // something temporary sits above the catalog (the clarification box, mainly) the page keeps its
  // cards readable and lets the DOCUMENT scroll a little instead of crushing them.
  const floorH = MIN_ROWS * MIN_CARD_H + (MIN_ROWS - 1) * GAP + PAGE_HEAD_H + PAGER_PAD;
  const pagerH = Math.max(floorH, window.innerHeight - top - DOTS_H - barH - 4);
  const gridH  = pagerH - PAGER_PAD - PAGE_HEAD_H;

  // Whole cards at the floor size, clamped: at least 2 rows (a page of 2 products would be all
  // swiping), at most the 10-per-page cap. Between those the screen decides.
  let rows = Math.floor((gridH + GAP) / (MIN_CARD_H + GAP));
  rows = Math.min(Math.floor(MAX_PER_PAGE / 2), Math.max(MIN_ROWS, rows));
  if (FORCED_PER) rows = Math.max(1, Math.ceil(FORCED_PER / 2));
  // Cards then grow to fill the leftover exactly — no dead strip at the bottom of a page. On a
  // screen too short even for one floor-height row the card shrinks instead of scrolling: the
  // page always fits, that is the whole point. ?per= is the exception — it pins a count the screen
  // may not have room for, so there the card keeps its size and that page scrolls (see .forced).
  const fill  = Math.floor((gridH - (rows - 1) * GAP) / rows);
  const cardH = FORCED_PER ? Math.max(MIN_CARD_H, fill) : Math.max(70, fill);
  return { pagerH, rows, cardH, size: FORCED_PER || rows * 2 };
}

// Apply the measured heights without re-chunking (resize that didn't change the products per page).
function applyLayout(L) {
  const pager = document.getElementById('pager');
  pager.style.height = L.pagerH + 'px';
  pager.style.setProperty('--card-h', L.cardH + 'px');
  pager.style.setProperty('--fit', IMG_FIT);
  pager.style.setProperty('--zoom', String(IMG_ZOOM || (catalog && catalog.imageZoom) || 1));
  pager.classList.toggle('forced', !!FORCED_PER);
}

function observePages() {
  const pager = document.getElementById('pager');
  const pages = pager.querySelectorAll('.page');
  if (!pages.length || !window.IntersectionObserver) return;
  pagerObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.intersectionRatio >= 0.6) setActivePage(Number(e.target.dataset.i)); });
  }, { root: pager, threshold: [0, 0.6, 0.95] });
  pages.forEach(p => pagerObserver.observe(p));
}

// Fetch the photos for the current page and its immediate neighbours, and nothing else.
//
// `loading="lazy"` is NOT enough here. It is a browser heuristic tuned for vertical scrolling; in a
// horizontal scroller the whole strip can count as "near the viewport", and support in the iOS
// WebView that WhatsApp opens links in has been unreliable. Measured on the Ariel catalog, leaving
// it to the browser fetched all 57 photos of a category — 8.3MB — to show four of them.
// Driving it from the pager's own IntersectionObserver is deterministic and testable instead.
const PRELOAD_PAGES = 2;    // pages either side of the current one to fetch immediately
function hydratePage(p) {
  p.querySelectorAll('img[data-src]').forEach(img => {
    img.src = img.getAttribute('data-src');
    img.removeAttribute('data-src');
  });
}
function hydratePages(center) {
  document.querySelectorAll('#pager .page').forEach(p => {
    if (Math.abs(Number(p.dataset.i) - center) > PRELOAD_PAGES) return;
    hydratePage(p);
  });
}

// Then quietly finish the REST of the current category in the background.
//
// What makes the photos feel slow is latency, not bytes: each one is only ~9KB, but Supabase
// Storage answers in 120-165ms and occasionally ~1.4s. No amount of tuning makes a single request
// faster — the only fix is to have asked for it earlier. So once the visible pages are on their
// way, walk the rest of this category during idle time; by the time a swipe lands anywhere in it
// the photo is already decoded.
//
// This is safe now in a way it was NOT when the grid was written. That warning ("leaving it to the
// browser fetched all 57 photos of a category — 8.3MB") measured the ORIGINAL studio images.
// prepare_photos.py cut them to ~9KB, so a whole 57-product category is now ~0.5MB. Deliberately
// bounded to the current category rather than the whole catalog: the customer chose this one.
const WARM_CHUNK = 2;       // pages per idle slice, so a slow connection is never flooded
function warmGroup(center) {
  if (idleWarm) { (window.cancelIdleCallback || clearTimeout)(idleWarm); idleWarm = null; }
  const pager = document.getElementById('pager');
  const here = pager.querySelector('.page[data-i="' + center + '"]');
  if (!here) return;
  const group = here.dataset.g;
  // Nearest-first: the next swipe is far likelier to be forwards from here than at the far end.
  const queue = Array.from(pager.querySelectorAll('.page[data-g="' + group + '"]'))
    .filter(p => p.querySelector('img[data-src]'))
    .sort((a, b) => Math.abs(a.dataset.i - center) - Math.abs(b.dataset.i - center));
  if (!queue.length) return;

  const idle = window.requestIdleCallback || (fn => setTimeout(() => fn({ timeRemaining: () => 8 }), 200));
  const step = () => {
    for (let n = 0; n < WARM_CHUNK && queue.length; n++) hydratePage(queue.shift());
    idleWarm = queue.length ? idle(step) : null;
  };
  idleWarm = idle(step);
}

function setActivePage(i) {
  if (i === pageIndex) return;
  pageIndex = i;
  if (pagerSig !== null) pageMemory[pagerSig] = i;   // this category resumes here next visit
  hydratePages(i);            // the next page is already warm by the time it is swiped to
  warmGroup(i);               // and keep filling in the rest of the category behind it
  const pager = document.getElementById('pager');
  pager.querySelectorAll('.page').forEach(p => p.classList.toggle('active', Number(p.dataset.i) === i));
  const dots = document.getElementById('pagedots');
  const counter = document.getElementById('page-counter');
  if (counter) counter.textContent = (i + 1) + ' / ' + pager.querySelectorAll('.page').length;
  else dots.querySelectorAll('.pdot').forEach((d, k) => d.classList.toggle('on', k === i));
  document.getElementById('swipe-hint').classList.add('hidden');
}

function goPage(i, behavior) {
  const el = document.querySelector('#pager .page[data-i="' + i + '"]');
  if (el) el.scrollIntoView({ behavior: behavior || 'smooth', inline: 'start', block: 'nearest' });
}

// Resize / rotate: if the screen now holds a different number of products, re-chunk; otherwise
// just re-apply the heights so the cards keep filling the page.
function relayout() {
  if (activeView !== 'catalog' || resolveLayout() !== 'grid') return;
  const L = computeLayout();
  if (L.size !== pageSize) renderPager();
  else applyLayout(L);
}
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(relayout, 120); });
window.addEventListener('orientationchange', () => setTimeout(relayout, 300));

function emptyList(text) {
  return '<div class="empty-list"><div class="empty-list-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></div><div class="empty-list-text">' + esc(text) + '</div></div>';
}

// ── LIST layout ──
// The live page's vertical list, plus a thumbnail for the products that do have a photo. This is
// what an org with no photos (or a handful) gets, and what every org gets on day one.
function renderList() {
  const el = document.getElementById('list');
  const built = buildGroups();
  if (built.empty) { el.innerHTML = emptyList(built.empty); return; }
  el.style.setProperty('--zoom', String(IMG_ZOOM || (catalog && catalog.imageZoom) || 1));
  el.innerHTML = built.groups.map(g =>
    '<div class="group">' +
      '<div class="group-head"><span class="group-title">' + esc(g.title) + '</span>' +
        '<span class="group-meta">' + esc(g.meta) + '</span></div>' +
      g.items.map(p => listCard(p.code, p.name, p.suggested)).join('') +
    '</div>').join('');
}

function listCard(code, name, suggested) {
  const col = catColorForCode(code);
  const initial = (name || '?').trim()[0] || '·';
  const q = qty[code] || 0;
  // The "מוצע" tag is always rendered when there is a suggestion, just hidden while the product has
  // a quantity — removing it would make it unrecoverable after a reset (see refreshCard).
  const tag = suggested ? '<span class="ltag' + (q ? ' hidden' : '') + '">מוצע ' + suggested + '</span>' : '';
  // The list scrolls vertically, which is what loading="lazy" is actually good at — but the same
  // initial-underneath structure keeps a slow or missing thumbnail from looking broken.
  const thumb = '<div class="lthumb" style="background:' + col.bg + ';color:' + col.fg + '">' +
    '<span class="pinitial" style="font-size:20px">' + esc(initial) + '</span>' +
    (hasImage(code)
      ? '<img src="' + esc(imageUrl(code)) + '" alt="" loading="lazy" decoding="async" ' +
        'onload="this.classList.add(\'on\')" onerror="this.remove()">'
      : '') + '</div>';
  return '<div class="prod lcard' + (q > 0 ? ' has-qty' : '') + '" data-code="' + esc(code) + '">' + thumb +
    '<div class="linfo"><div class="lname">' + esc(name) + '</div>' +
      '<div class="lmeta"><span class="lsku">' + esc(displayCode(code)) + '</span>' + tag + '</div></div>' +
    '<div class="pcard-action">' + cardAction(code) + '</div></div>';
}

function productCard(code, name, suggested) {
  const col = catColorForCode(code);
  const initial = (name || '?').trim()[0] || '·';
  const q = qty[code] || 0;
  const tag = suggested ? '<span class="ptag' + (q ? ' hidden' : '') + '">מוצע ' + suggested + '</span>' : '';
  const badge = q > 0 ? '<span class="pqty-badge">' + q + '</span>' : '';
  // The photo carries data-src, NOT src — hydratePages() decides when it is fetched (see there).
  // The tinted initial underneath covers "no photo", "not loaded yet" and "failed" alike.
  const img = hasImage(code)
    ? '<img data-src="' + esc(imageUrl(code)) + '" alt="' + esc(name) + '" decoding="async" ' +
      'onload="this.classList.add(\'on\')" onerror="this.remove()">'
    : '';
  return '<div class="prod pcard' + (q > 0 ? ' has-qty' : '') + '" data-code="' + esc(code) + '">' +
    '<div class="pthumb" style="background:' + col.bg + '">' +
      '<span class="pinitial" style="color:' + col.fg + '">' + esc(initial) + '</span>' +
      img + badge + tag + '<span class="pcode">' + esc(displayCode(code)) + '</span>' +
    '</div>' +
    '<div class="pname">' + esc(name) + '</div>' +
    '<div class="pcard-action">' + cardAction(code) + '</div></div>';
}

function cardAction(code) {
  const q = qty[code] || 0;
  if (q <= 0) {
    return '<button class="add-btn" onclick="add(\'' + js(code) + '\')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"></path></svg>הוסף</button>';
  }
  return '<div class="stepper">' +
    '<button class="qbtn minus" onclick="dec(\'' + js(code) + '\')" aria-label="הפחת">−</button>' +
    '<button class="qnum" onclick="openKeypad(\'' + js(code) + '\')">' + q + '</button>' +
    '<button class="qbtn plus" onclick="inc(\'' + js(code) + '\')" aria-label="הוסף">+</button></div>';
}

// Update one catalog card's action, badge + highlight in place (no re-render → no flicker, and the
// pager keeps its scroll position on the page the customer is looking at).
function refreshCard(code) {
  const card = document.querySelector('#plist .prod[data-code="' + (window.CSS && CSS.escape ? CSS.escape(code) : code) + '"]');
  if (!card) return;
  const q = qty[code] || 0;
  card.classList.toggle('has-qty', q > 0);
  const act = card.querySelector('.pcard-action');
  if (act) act.innerHTML = cardAction(code);
  // Quantity badge over the photo (grid only — in the list the stepper already shows the number).
  const thumb = card.querySelector('.pthumb');
  let badge = card.querySelector('.pqty-badge');
  if (q > 0) {
    if (!badge && thumb) { badge = document.createElement('span'); badge.className = 'pqty-badge'; thumb.appendChild(badge); }
    if (badge) badge.textContent = q;
  } else if (badge) {
    badge.remove();
  }
  // A favourite's "מוצע" tag hides while the product has a quantity and comes BACK at zero — after
  // "אפס כמויות" the customer needs to see what adopting again would put in the cart.
  const tag = card.querySelector('.ptag, .ltag');
  if (tag) tag.classList.toggle('hidden', q > 0);
}

function updateBars() {
  const n = lines().length;   // distinct items — the only count we surface on the bar
  const badge = document.getElementById('badge');
  document.getElementById('badge-count').textContent = n;
  badge.classList.toggle('on', n > 0 || isEditOrder());
  const bar = document.getElementById('bar-btn');
  if (n > 0) {
    bar.className = 'bar-btn on';
    bar.innerHTML = '<span class="bar-btn-left"><span class="bar-btn-count">' + n + '</span>המשך לעגלה</span><span style="font-size:19px">←</span>';
  } else if (isEditOrder()) {
    bar.className = 'bar-btn on';
    bar.innerHTML = '<span class="bar-btn-left">המשך לעגלה</span><span style="font-size:19px">←</span>';
  } else {
    bar.className = 'bar-btn';
    bar.innerHTML = 'בחר מוצרים כדי להתחיל';
  }
}

// ── quantity actions ──
const MAX_QTY = 9999; // must match the backend applyWebOrder MAX_QTY — a larger qty is dropped server-side
function setQty(code, val) {
  if (val <= 0) delete qty[code]; else qty[code] = Math.min(MAX_QTY, val);
}
function applyQtyChange(code, opts) {
  refreshCard(code);
  updateBars();
  // needs_qty debounce: ~1s after the LAST tap (rapid taps reset it), auto-confirm — drop it from the
  // needs-qty set so its clarify row clears and it settles into the cart. At qty 0 it stays (still needed).
  if (needsQty.has(code)) {
    clearTimeout(needsQtyTimers[code]);
    if ((qty[code] || 0) > 0) needsQtyTimers[code] = setTimeout(() => {
      needsQty.delete(code); delete needsQtyTimers[code];
      if (activeView === 'cart') renderCart(); else renderClarifyBox();
    }, 1000);
  }
  if (activeView === 'cart') renderCart();
  else renderClarifyBox();   // catalog view: keep the inline "אשר כמות" clarify rows in sync as qty changes
  if (opts && opts.toast) toast(opts.toast);
}
function add(code) { setQty(code, (qty[code] || 0) + 1); applyQtyChange(code, { toast: findSku(code).name + ' נוסף לסל' }); }
function inc(code) { const n = (qty[code] || 0) + 1; setQty(code, n); applyQtyChange(code, { toast: findSku(code).name + ' × ' + n }); }
function dec(code) { setQty(code, (qty[code] || 0) - 1); applyQtyChange(code); }
function removeFromCart(code) {
  const prev = qty[code] || 0;
  setQty(code, 0);
  needsQty.delete(code);   // removing a needs-qty line means "not ordered" — clear its confirm flag
  lastRemoved = { code, qty: prev };
  refreshCard(code); updateBars(); renderCart();
  toast('הוסר מהעגלה', true);
}
function undoRemove() {
  if (!lastRemoved) return;
  const code = lastRemoved.code;
  setQty(code, lastRemoved.qty);
  lastRemoved = null;
  clearToast();
  refreshCard(code); updateBars();
  if (activeView === 'cart') renderCart();
}
function addSuggested(code, q) { setQty(code, q); refreshCard(code); updateBars(); renderCart(); toast(findSku(code).name + ' × ' + q); }

// ── fastest path: adopt the suggested quantities (stay on the page; no jump to cart) ──
// The hero button toggles: adopt → reset → adopt. Reset restores the cart to exactly what it was
// before adopting (not zero), so a customer who already had items doesn't lose them by undoing.
function adopt() {
  adoptedSnapshot = { ...qty };                       // remember what to undo back to
  // Update the cards in place rather than re-rendering: the pager keeps the page the customer is on.
  (catalog.favorites || []).forEach(f => { setQty(f.sku_code, f.suggested_qty); refreshCard(f.sku_code); });
  updateBars();
  renderHero();                                       // button becomes "reset"
  toast('אומצו הכמויות המוצעות');
}
function resetAdopt() {
  const before = adoptedSnapshot || {};
  const touched = new Set([...Object.keys(qty), ...Object.keys(before)]);
  qty = { ...before };
  adoptedSnapshot = null;
  touched.forEach(refreshCard);
  updateBars();
  renderHero();                                       // button becomes "adopt" again
  if (activeView === 'cart') renderCart();
  toast('הכמויות אופסו');
}

// ── search ──
function onSearch(v) {
  searchQuery = (v || '').trim();
  document.getElementById('search-clear').classList.toggle('hidden', !searchQuery);
  renderCatalog();
}
function clearSearch() {
  searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.add('hidden');
  renderCatalog();
}
function switchTab(id) {
  clearSearch();
  activeTab = id; activeCat = null;
  renderCatalog();
}
function switchCat(id) { activeCat = id; renderCatalog(); }

// ── keypad sheet ──
function openKeypad(code) { keypad = { code }; keypadBuf = String(qty[code] || ''); keypadFresh = true; keypadEntry = { back: rawCloseKeypad }; openOverlay(keypadEntry); renderKeypad(); }
function rawCloseKeypad() { keypad = null; keypadBuf = ''; document.getElementById('keypad').classList.add('hidden'); }
function closeKeypad() { const e = keypadEntry; keypadEntry = null; rawCloseKeypad(); unwindOverlay(e); }
// Overwrite mode: the keypad opens showing the current quantity, and the FIRST digit typed replaces
// it rather than appending — retyping a quantity is the common case, editing its digits is not.
